services:
  db:
    image: postgres:16-alpine
    container_name: pep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pep_user
      POSTGRES_PASSWORD: pep_password
      POSTGRES_DB: pep_portail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: